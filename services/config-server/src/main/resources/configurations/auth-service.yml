spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: shah
    password: shah
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
server:
  port: 8030

application:
  security:
    default-admin:
      email: ${DEFAULT_ADMIN_EMAIL:admin@ecommerce.com}
      password: ${DEFAULT_ADMIN_PASSWORD:Admin@123}
